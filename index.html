<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词根记忆卡 · 高频词汇 T-V</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1f2937; --sub:#6b7280;
  --line:#e5e7eb; --brand:#4f46e5; --brand2:#7c3aed; --brand-soft:#eef2ff;
  --ok:#059669; --ok-soft:#ecfdf5; --warn:#d97706; --star:#f59e0b;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(31,41,55,.06);
  --shadow-lg:0 12px 40px rgba(79,70,229,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- Header ---------- */
header{background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#9333ea);color:#fff;
  padding:30px 0 26px;box-shadow:0 6px 24px rgba(79,70,229,.25)}
.hd-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.16);
  display:grid;place-items:center;font-size:24px;backdrop-filter:blur(6px)}
.brand h1{font-size:21px;font-weight:800;letter-spacing:.5px}
.brand p{font-size:12.5px;opacity:.85;font-weight:500}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);
  border-radius:12px;padding:8px 14px;text-align:center;min-width:74px;backdrop-filter:blur(6px)}
.stat b{display:block;font-size:19px;font-weight:800}
.stat span{font-size:11px;opacity:.85}

/* ---------- Toolbar ---------- */
.weekbar{background:linear-gradient(135deg,#eef2ff,#f5f0ff);border:1.5px solid #e3e0f5;
  border-radius:14px;margin:-18px auto 14px;padding:12px 16px;display:flex;gap:10px;
  align-items:center;flex-wrap:wrap;position:relative;z-index:6}
.weekbar .wk-label{font-size:14px;font-weight:700;color:#5b4bc4}
.weekbar select{border:1.5px solid #cfc8ee;border-radius:10px;padding:9px 12px;font-size:14.5px;
  font-weight:600;color:#3d3570;background:#fff;outline:none;cursor:pointer;min-width:200px}
.weekbar .wk-hint{font-size:12.5px;color:var(--sub);margin-left:auto}
.toolbar{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  margin:0 auto 22px;padding:14px 16px;display:flex;gap:12px;align-items:center;
  flex-wrap:wrap;position:relative;z-index:5}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;border:1.5px solid var(--line);border-radius:11px;
  padding:11px 14px 11px 38px;font-size:14.5px;outline:none;transition:.2s;background:#fbfbfd}
.search input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.search::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
.seg{display:flex;background:#f1f2f7;border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 15px;border-radius:9px;
  font-size:13.5px;font-weight:600;color:var(--sub);cursor:pointer;transition:.18s;white-space:nowrap}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.accent-sel{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--sub)}
.accent-sel select{border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;
  font-size:13.5px;background:#fbfbfd;cursor:pointer;color:var(--ink);outline:none}

/* ---------- Letter nav ---------- */
.letters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.letters button{border:1.5px solid var(--line);background:#fff;border-radius:10px;
  width:40px;height:40px;font-weight:800;font-size:15px;color:var(--sub);cursor:pointer;transition:.18s}
.letters button:hover{border-color:var(--brand);color:var(--brand)}
.letters button.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ---------- Root group ---------- */
.group{background:var(--card);border-radius:18px;box-shadow:var(--shadow);
  margin-bottom:18px;overflow:hidden}
.g-head{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;
  background:linear-gradient(90deg,var(--brand-soft),#fff);border-bottom:1px solid var(--line)}
.g-badge{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:800;
  padding:7px 15px;border-radius:11px;font-size:15px;letter-spacing:.5px;box-shadow:0 3px 10px rgba(79,70,229,.3)}
.g-mean{font-size:16px;font-weight:700;color:var(--ink)}
.g-mean small{color:var(--sub);font-weight:500;font-size:13px;margin-left:6px}
.g-count{margin-left:auto;font-size:12.5px;color:var(--sub);background:#f1f2f7;
  padding:4px 11px;border-radius:20px;font-weight:600}
.g-play{border:0;background:var(--brand-soft);color:var(--brand);width:36px;height:36px;
  border-radius:10px;cursor:pointer;font-size:15px;transition:.18s;flex-shrink:0}
.g-play:hover{background:var(--brand);color:#fff}

.g-body{padding:16px 20px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.g-body.collapsed{display:none}

/* ---------- Word card ---------- */
.card{border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;
  background:#fff;transition:.2s;position:relative}
.card:hover{border-color:#c7cbf5;box-shadow:var(--shadow);transform:translateY(-2px)}
.card.mastered{background:var(--ok-soft);border-color:#a7f3d0}
.c-top{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.c-word{font-size:19px;font-weight:800;color:var(--brand);letter-spacing:.3px}
.card.mastered .c-word{color:var(--ok)}
.c-play{border:0;background:var(--brand-soft);color:var(--brand);width:30px;height:30px;
  border-radius:8px;cursor:pointer;font-size:13px;transition:.18s;flex-shrink:0}
.c-play:hover{background:var(--brand);color:#fff;transform:scale(1.08)}
.c-star{margin-left:auto;border:0;background:transparent;font-size:19px;cursor:pointer;
  opacity:.3;transition:.18s;line-height:1}
.c-star:hover{opacity:.7;transform:scale(1.15)}
.c-star.on{opacity:1;filter:drop-shadow(0 1px 3px rgba(245,158,11,.4))}
.c-ph{font-size:13px;color:var(--sub);font-family:"Times New Roman",Georgia,serif;margin-bottom:7px}
.c-def{font-size:13.5px;color:#374151;margin-bottom:8px;line-height:1.55}
.c-ex{font-size:12.5px;color:var(--sub);border-left:3px solid var(--brand-soft);
  padding:2px 0 2px 10px;font-style:italic}
.c-ex .en{color:#4b5563;display:block}
.c-ex .cn{color:#9ca3af;font-style:normal;display:block;margin-top:1px}
.c-check{position:absolute;bottom:12px;right:13px;border:0;background:#f1f2f7;color:var(--sub);
  font-size:11px;padding:4px 10px;border-radius:20px;cursor:pointer;font-weight:600;transition:.18s;display:none}
.card:hover .c-check{display:block}
.card.mastered .c-check{display:block;background:var(--ok);color:#fff}

/* ---------- Flashcard mode ---------- */
.fc-stage{display:none;padding:24px 0 40px}
.fc-stage.on{display:block}
.fc-bar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;justify-content:center}
.fc-progress{font-size:13.5px;color:var(--sub);font-weight:600}
.fc-scope{border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13.5px;background:#fff;cursor:pointer;outline:none}
.flip{max-width:520px;margin:0 auto;perspective:1600px}
.flip-inner{position:relative;width:100%;min-height:290px;transition:transform .6s;
  transform-style:preserve-3d;cursor:pointer}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;
  background:var(--card);box-shadow:var(--shadow-lg);padding:34px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;text-align:center}
.face.back{transform:rotateY(180deg);background:linear-gradient(135deg,#faf7ff,#fff)}
.fc-word{font-size:40px;font-weight:800;color:var(--brand);letter-spacing:1px;margin-bottom:10px}
.fc-ph{font-size:17px;color:var(--sub);font-family:Georgia,serif;margin-bottom:22px}
.fc-play-big{border:0;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;
  width:58px;height:58px;border-radius:50%;font-size:24px;cursor:pointer;box-shadow:0 6px 18px rgba(79,70,229,.35);transition:.2s}
.fc-play-big:hover{transform:scale(1.1)}
.fc-hint{font-size:12.5px;color:#c0c4cc;margin-top:20px}
.fc-def{font-size:17px;color:var(--ink);font-weight:600;margin-bottom:16px;line-height:1.7}
.fc-ex-en{font-size:14px;color:#4b5563;font-style:italic;margin-bottom:4px}
.fc-ex-cn{font-size:13px;color:var(--sub)}
.fc-root{margin-top:18px;font-size:12px;color:var(--brand);background:var(--brand-soft);padding:4px 12px;border-radius:20px}
.fc-ctrl{display:flex;gap:12px;justify-content:center;margin-top:24px}
.fc-btn{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 26px;
  font-size:15px;font-weight:700;cursor:pointer;transition:.18s;color:var(--ink)}
.fc-btn:hover{border-color:var(--brand);color:var(--brand)}
.fc-btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.fc-btn.primary:hover{background:#4338ca;color:#fff}
.fc-btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}

/* ---------- Quiz mode ---------- */
.quiz-stage{display:none;padding:24px 0 40px}
.quiz-stage.on{display:block}
.quiz-box{max-width:560px;margin:0 auto;background:var(--card);border-radius:22px;
  box-shadow:var(--shadow-lg);padding:32px 30px}
.q-num{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:6px}
.q-prompt{font-size:15px;color:var(--ink);margin-bottom:18px}
.q-prompt b{color:var(--brand);font-size:17px}
.q-def{font-size:20px;font-weight:700;text-align:center;padding:20px;background:var(--brand-soft);
  border-radius:14px;margin-bottom:20px;color:#4338ca}
.q-opts{display:grid;gap:10px}
.q-opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px 18px;
  font-size:16px;font-weight:600;cursor:pointer;text-align:left;transition:.15s;color:var(--ink);font-family:Georgia,serif}
.q-opt:hover{border-color:var(--brand);background:var(--brand-soft)}
.q-opt.correct{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.q-opt.wrong{background:#fef2f2;border-color:#f87171;color:#dc2626}
.q-next{margin-top:20px;width:100%;border:0;background:var(--brand);color:#fff;
  border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;transition:.18s;display:none}
.q-next.show{display:block}
.q-next:hover{background:#4338ca}
.quiz-result{text-align:center;padding:20px 0}
.quiz-result .big{font-size:52px;font-weight:800;color:var(--brand);margin:8px 0}
.quiz-result p{color:var(--sub);margin-bottom:20px}

/* ---------- Speed mode (极速中文义速览) ---------- */
.sp-stage{display:none;padding:6px 0 40px}
.sp-stage.on{display:block}
.sp-bar{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:11px 14px;
  margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp-seg{display:flex;background:#f1f2f7;border-radius:10px;padding:3px;gap:2px}
.sp-seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;
  font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap;transition:.18s}
.sp-seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sp-chk{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.sp-btn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;
  font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);transition:.18s}
.sp-btn:hover{border-color:var(--brand);color:var(--brand)}
.sp-btn.playing{background:var(--brand);color:#fff;border-color:var(--brand)}
.sp-info{margin-left:auto;font-size:12.5px;color:var(--sub);font-weight:600}
.sp-gh{display:flex;align-items:center;gap:9px;margin:16px 0 8px;padding:02px}
.sp-gh .b{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:800;
  padding:3px 11px;border-radius:8px;font-size:12.5px}
.sp-gh .m{font-size:13.5px;font-weight:700;color:var(--ink)}
.sp-gh .c{margin-left:auto;font-size:11.5px;color:var(--sub);background:#f1f2f7;padding:2px 9px;border-radius:20px}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:5px}
.sp-item{display:flex;align-items:baseline;gap:5px;padding:7px 9px;border-radius:9px;
  background:#fff;border:1px solid var(--line);cursor:pointer;transition:.14s;overflow:hidden}
.sp-item:hover{border-color:#c7cbf5;background:#fbfaff}
.sp-item.mastered{background:var(--ok-soft);border-color:#a7f3d0}
.sp-en{font-weight:700;color:var(--brand);font-size:13.5px;font-family:Georgia,"Times New Roman",serif;flex-shrink:0}
.sp-item.mastered .sp-en{color:var(--ok)}
.sp-pos{font-size:10px;font-weight:700;padding:1px 4px;border-radius:4px;flex-shrink:0;
  background:#f1f2f7;color:#9ca3af;font-family:sans-serif}
.sp-pos.p-n{background:#e0f2fe;color:#0369a1}
.sp-pos.p-v{background:#ffedd5;color:#c2410c}
.sp-pos.p-a{background:#dcfce7;color:#15803d}
.sp-pos.p-d{background:#f3e8ff;color:#7e22ce}
.sp-cn{font-size:12.5px;color:#374151;margin-left:auto;text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:0 2px}
.sp-item.hcn .sp-cn{background:#dfe2ea;color:transparent}
.sp-item.hen .sp-en,.sp-item.hen .sp-pos{background:#dfe2ea;color:transparent;border-radius:4px}
.sp-item.reveal .sp-cn,.sp-item.reveal .sp-en,.sp-item.reveal .sp-pos{background:transparent}
.sp-item.reveal .sp-cn{color:#374151}
.sp-item.reveal .sp-en{color:var(--brand)}
.sp-item.speaking{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 2px var(--brand-soft)}
.sp-tip{font-size:12px;color:#9ca3af;margin-bottom:10px;padding:0 2px}
@media(max-width:560px){.sp-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.sp-info{margin-left:0;width:100%}}

.empty{text-align:center;padding:50px 20px;color:var(--sub)}
.empty .ico{font-size:44px;margin-bottom:12px}
footer{text-align:center;padding:28px 20px;color:#9ca3af;font-size:12.5px}
@media(max-width:560px){
  .g-body{grid-template-columns:1fr}
  .stats{width:100%;justify-content:flex-start}
  .fc-word{font-size:32px}
}
</style>
</head>
<body>
<header>
  <div class="wrap hd-top">
    <div class="brand">
      <div class="logo">📖</div>
      <div>
        <h1>词根记忆卡</h1>
        <p id="subTitle">高频词汇 · 每周一组</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="stWords">0</b><span>单词</span></div>
      <div class="stat"><b id="stRoots">0</b><span id="stRootsLabel">词根</span></div>
      <div class="stat"><b id="stMastered">0</b><span>已掌握</span></div>
      <div class="stat"><b id="stStar">0</b><span>收藏</span></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="weekbar">
    <span class="wk-label">📅 学习周次</span>
    <select id="weekSel"></select>
    <span class="wk-hint" id="weekHint"></span>
  </div>
  <div class="toolbar">
    <div class="search"><input id="searchInput" placeholder="搜索单词 / 词根 / 释义…"></div>
    <div class="seg" id="modeSeg">
      <button data-mode="speed" class="on">⚡ 速览</button>
      <button data-mode="browse">📚 浏览</button>
      <button data-mode="flash">🎴 卡片</button>
      <button data-mode="quiz">✏️ 测验</button>
    </div>
    <div class="accent-sel">
      🔊<select id="accentSel">
        <option value="en-GB">英式发音</option>
        <option value="en-US">美式发音</option>
      </select>
    </div>
  </div>

  <div id="filterBar">
    <div class="letters" id="letterNav"></div>
    <div class="letters" style="margin-top:-8px">
      <button id="filterStar" style="width:auto;padding:0 14px">⭐ 只看收藏</button>
      <button id="filterAll" class="on" style="width:auto;padding:0 14px">全部单词</button>
    </div>
  </div>

  <!-- SPEED (极速中文义速览) -->
  <div id="speedStage" class="sp-stage on">
    <div class="sp-bar">
      <div class="sp-seg" id="spViewSeg">
        <button data-v="both" class="on">👀 词+义</button>
        <button data-v="hidecn">🙈 遮中文</button>
        <button data-v="hideen">🙉 遮单词</button>
      </div>
      <label class="sp-chk"><input type="checkbox" id="spFull"> 完整释义</label>
      <label class="sp-chk"><input type="checkbox" id="spHideMastered">隐藏已掌握</label>
      <button class="sp-btn" id="spAutoPlay">▶ 连续播放</button>
      <span class="sp-info" id="spInfo"></span>
    </div>
    <div class="sp-tip">💡 点词条听发音 · 遮盖模式下点一下临时揭开 · 双击标记「已掌握」</div>
    <div id="speedList"></div>
  </div>

  <!-- BROWSE -->
  <div id="browseStage" style="display:none">
    <div id="groupList"></div>
  </div>

  <!-- FLASHCARD -->
  <div id="flashStage" class="fc-stage">
    <div class="fc-bar">
      <select class="fc-scope" id="fcScope"></select>
      <span class="fc-progress" id="fcProgress">0 / 0</span>
    </div>
    <div class="flip" id="flip">
      <div class="flip-inner">
        <div class="face front">
          <div class="fc-word" id="fcWord">—</div>
          <div class="fc-ph" id="fcPh"></div>
          <button class="fc-play-big" id="fcPlay">🔊</button>
          <div class="fc-hint">点击卡片查看释义 · 点喇叭听发音</div>
        </div>
        <div class="face back">
          <div class="fc-def" id="fcDef"></div>
          <div class="fc-ex-en" id="fcExEn"></div>
          <div class="fc-ex-cn" id="fcExCn"></div>
          <div class="fc-root" id="fcRoot"></div>
        </div>
      </div>
    </div>
    <div class="fc-ctrl">
      <button class="fc-btn" id="fcPrev">← 上一个</button>
      <button class="fc-btn ok" id="fcMaster">✓ 已掌握</button>
      <button class="fc-btn primary" id="fcNext">下一个 →</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quizStage" class="quiz-stage">
    <div class="quiz-box" id="quizBox"></div>
  </div>
</div>

<footer>词根记忆卡 · 数据来自「品睿教育」高频词汇表 · 发音由浏览器语音合成（Web Speech API）提供</footer>

<script>
// 品睿教育 高频词汇表（词根词缀分组） T-V 部分
// 数据结构: { root: 词根, meaning: 词根义, words: [{w:单词, ph:音标, def:释义, ex:例句, tr:翻译}] }
var WORD_DATA = [
  {
    root: "tail", meaning: "剪", letter: "T",
    words: [
      { w: "tail", ph: "[teɪl]", def: "n.尾巴；尾部；跟踪者 vt.尾随，跟踪", ex: "a black dog with a long tail.", tr: "一只长尾巴的黑狗。" },
      { w: "tailor", ph: "[ˈteɪlə(r)]", def: "n.裁缝 v.缝制,剪裁", ex: "I was promoted to overseer at the tailor shop.", tr: "我被提拔为这家裁缝铺的工头。" },
      { w: "retail", ph: "[ˈriːteɪl]", def: "n.零售", ex: "The retail division is BT's cash cow.", tr: "零售部是英国电信公司的摇钱树。" },
      { w: "entail", ph: "[ɪnˈteɪl]", def: "vt.使承担；需要；把(疾病等)遗传给;限定", ex: "What kind of responsibilities does that job entail?", tr: "那份工作需要承担什么样的责任？" }
    ]
  },

<script>
/* 把各周词表汇总到 WEEKS，WORD_DATA 指向"当前周"。以后每周新增：加一份 words_weekN.js 并在此追加一项即可。 */
var WEEKS=[];
if(typeof WORD_DATA!=='undefined'&&WORD_DATA){WEEKS.push({name:'第1周 · 词根词缀高频词 (T–V)',sub:'按词根词缀分组速记',data:WORD_DATA});}
if(typeof WORD_DATA_WEEK2!=='undefined'&&WORD_DATA_WEEK2){WEEKS.push({name:'第2周 · 基础词汇 (T–Z)',sub:'常用基础单词表',data:WORD_DATA_WEEK2});}
</script>
<script>
/* 兼容 ES5：全部改写为老旧手机浏览器（安卓自带/X5/UC/QQ内核等）也能解析执行的写法。
   之前用了对象/数组展开语法，旧内核解析即失败导致整段脚本不执行、数据全 0。*/
(function(){
'use strict';

/* ---- 数据保护：词表没加载或为空时给出提示，而不是白屏 ---- */
if(typeof WEEKS==='undefined'||!WEEKS||!WEEKS.length){
  var gl=document.getElementById('groupList');
  if(gl){gl.innerHTML='<div class="empty"><div class="ico">📭</div>单词数据未能加载，请刷新页面重试</div>';}
  return;
}
/* 当前周下标：优先读本地记忆，默认最后一周(最新一周) */
var curWeek=0;
try{var wsaved=localStorage.getItem('wordmem_curweek');if(wsaved!==null&&wsaved!==''){curWeek=parseInt(wsaved,10)||0;}else{curWeek=WEEKS.length-1;}}catch(e){curWeek=WEEKS.length-1;}
if(curWeek<0||curWeek>=WEEKS.length)curWeek=WEEKS.length-1;
/* WORD_DATA 指向当前周（全局变量，供所有渲染函数读取） */
WORD_DATA=WEEKS[curWeek].data;

/* 浅拷贝对象（替代 {...obj}），可附加额外字段 */
function assign(target){
  target=target||{};
  for(var a=1;a<arguments.length;a++){
    var s=arguments[a];
    if(s){for(var k in s){if(Object.prototype.hasOwnProperty.call(s,k)){target[k]=s[k];}}}
  }
  return target;
}
function copyWord(w,extra){return assign({},w,extra);}
function toArr(x){var r=[];for(var i=0;i<x.length;i++){r[i]=x[i];}return r;}
/* 判断是否为"字母组"(基础词表,root是单个字母),用于决定是否显示"词根"字样 */
function isLetterGroup(g){return g&&g.root&&g.root.length===1&&/[A-Za-z]/.test(g.root);}

/* ============ 状态 ============ */
var LS='wordmem_tv_v1';
var store={};
try{store=JSON.parse(localStorage.getItem(LS)||'{}')||{};}catch(e){store={};}
store.mastered=store.mastered||{};
store.star=store.star||{};
function save(){try{localStorage.setItem(LS,JSON.stringify(store));}catch(e){}}

var curLetter='ALL', curSearch='', starOnly=false;

/* ============ 发音 ============
   策略：优先用在线音频(有道词典标准发音 mp3)，微信/QQ/UC 等国产内核都能播；
   在线播放失败时，兜底用浏览器自带语音合成(Web Speech API)。 */
var voices=[];
var hasTTS=('speechSynthesis' in window)&&(typeof SpeechSynthesisUtterance!=='undefined');
function loadVoices(){if(hasTTS){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}}
if(hasTTS){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}

/* ---- 发音缓存：同一单词的 Audio 对象复用，第二次起零延迟 ---- */
var AC={},ACQ=[],AC_MAX=400;
function vkey(w,t){return t+':'+w;}
function voiceUrl(w,t){return 'https://dict.youdao.com/dictvoice?type='+t+'&audio='+encodeURIComponent(w);}
function curType(){var a='en-US';try{a=document.getElementById('accentSel').value;}catch(e){}return (a==='en-GB')?1:2;}
function normWord(x){return (''+(x||'')).replace(/^\s+|\s+$/g,'').split(/\s+/)[0].replace(/[^a-zA-Z\-']/g,'');}
function getAudio(w,t){
  var k=vkey(w,t);
  if(AC[k]){return AC[k];}
  var a=new Audio();
  a.preload='auto';
  a.src=voiceUrl(w,t);
  try{a.load();}catch(e){}
  AC[k]=a;ACQ.push(k);
  while(ACQ.length>AC_MAX){var o=ACQ.shift();if(AC[o]&&AC[o]!==a){try{AC[o].src='';}catch(e){}delete AC[o];}}
  return a;
}
/* 预加载：鼠标悬停/手指按下时就开始下载，等真正点下去音频已就绪 */
function preloadWord(x){var w=normWord(x);if(w){getAudio(w,curType());}}
window.preloadWord=preloadWord;

var voices=[];
var hasTTS=('speechSynthesis' in window)&&(typeof SpeechSynthesisUtterance!=='undefined');
function loadVoices(){if(hasTTS){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}}
if(hasTTS){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}

function ttsFallback(text){
  if(!hasTTS){return false;}
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    var lang='en-US';
    try{lang=document.getElementById('accentSel').value;}catch(e){}
    u.lang=lang; u.rate=0.9; u.pitch=1;
    var v=null,i;
    for(i=0;i<voices.length;i++){if(voices[i].lang===lang){v=voices[i];break;}}
    if(!v){for(i=0;i<voices.length;i++){if(voices[i].lang&&voices[i].lang.indexOf('en')===0){v=voices[i];break;}}}
    if(v)u.voice=v;
    speechSynthesis.speak(u);
    return true;
  }catch(e){return false;}
}
/* speak(text, onEnd)：onEnd 在这个词读完后回调，用于连续播放精准衔接 */
var _cur=null;
function speak(text,onEnd){
  var t=(''+(text||'')).replace(/^\s+|\s+$/g,'');
  if(!t){if(onEnd)onEnd();return;}
  var w=normWord(t);
  if(!w){ttsFallback(t);if(onEnd)setTimeout(onEnd,900);return;}
  var type=curType(),a=getAudio(w,type),done=false;
  if(_cur&&_cur!==a){try{_cur.pause();}catch(e){}}
  _cur=a;
  function fin(){if(done){return;}done=true;if(onEnd){onEnd();}}
  function fail(){
    if(done){return;}done=true;
    var k=vkey(w,type);
    if(AC[k]){try{AC[k].src='';}catch(e){}delete AC[k];}  /* 失败不留缓存，下次重试 */
    ttsFallback(t);
    if(onEnd){setTimeout(onEnd,900);}
  }
  a.onended=fin; a.onerror=fail;
  try{if(a.currentTime>0){a.currentTime=0;}}catch(e){}
  try{
    var p=a.play();
    if(p&&typeof p.then==='function'){p['catch'](fail);}
  }catch(e){fail();}
}
window.speak=speak;

/* 切换英式/美式时清空音频缓存并预热当前可见词*/
(function(){
  var sel=document.getElementById('accentSel');
  if(!sel)return;
  sel.onchange=function(){
    for(var k in AC){if(Object.prototype.hasOwnProperty.call(AC,k)){try{AC[k].src='';}catch(e){}}}
    AC={};ACQ=[];_cur=null;
    if(typeof warmVisible==='function')warmVisible();
  };
})();

/* ============ 工具 ============ */
function allWords(){
  var arr=[];
  for(var i=0;i<WORD_DATA.length;i++){
    var g=WORD_DATA[i];
    for(var j=0;j<g.words.length;j++){
      arr.push(copyWord(g.words[j],{root:g.root,mean:g.meaning,letter:g.letter}));
    }
  }
  return arr;
}
function countStore(obj){var n=0;for(var k in obj){if(Object.prototype.hasOwnProperty.call(obj,k)&&obj[k])n++;}return n;}
function filteredGroups(){
  var out=[];
  for(var i=0;i<WORD_DATA.length;i++){
    var g=WORD_DATA[i];
    if(!(curLetter==='ALL'||g.letter===curLetter))continue;
    var ws=g.words;
    if(starOnly){ws=ws.filter(function(w){return store.star[w.w];});}
    if(curSearch){
      var q=curSearch.toLowerCase();
      ws=ws.filter(function(w){
        return w.w.toLowerCase().indexOf(q)>-1||w.def.indexOf(curSearch)>-1||g.root.indexOf(q)>-1||g.meaning.indexOf(curSearch)>-1;
      });
    }
    if(ws.length>0){out.push(assign({},g,{words:ws}));}
  }
  return out;
}

/* ============ 统计 ============ */
function updateStats(){
  document.getElementById('stWords').textContent=allWords().length;
  document.getElementById('stRoots').textContent=WORD_DATA.length;
  document.getElementById('stMastered').textContent=countStore(store.mastered);
  document.getElementById('stStar').textContent=countStore(store.star);
}

/* ============ 浏览渲染 ============ */
function renderBrowse(){
  var box=document.getElementById('groupList');
  var groups=filteredGroups();
  if(groups.length===0){
    box.innerHTML='<div class="empty"><div class="ico">🔍</div>没有匹配的单词</div>';return;
  }
  var html='';
  for(var i=0;i<groups.length;i++){
    var g=groups[i];
    var cards='';
    for(var j=0;j<g.words.length;j++){cards+=cardHTML(g.words[j],g);}
    var isLG=isLetterGroup(g);
    var meanSmall=isLG?'<small>字母表 · '+g.letter+'</small>':'<small>词根 · '+g.letter+'</small>';
    var playBtn=isLG?'':'<button class="g-play" onclick="event.stopPropagation();speak(\''+g.root+'\')">🔊</button>';
    html+='<div class="group">'
      +'<div class="g-head" onclick="toggleGroup(this)">'
      +'<span class="g-badge">'+g.root+'</span>'
      +'<span class="g-mean">'+g.meaning+meanSmall+'</span>'
      +playBtn
      +'<span class="g-count">'+g.words.length+' 词</span>'
      +'</div>'
      +'<div class="g-body">'+cards+'</div>'
      +'</div>';
  }
  box.innerHTML=html;
}
function cardHTML(w,g){
  var m=store.mastered[w.w]?'mastered':'';
  var st=store.star[w.w]?'on':'';
  return '<div class="card '+m+'" data-w="'+w.w+'">'
    +'<div class="c-top">'
    +'<span class="c-word">'+w.w+'</span>'
    +'<button class="c-play" onmouseenter="preloadWord(\''+w.w+'\')" ontouchstart="preloadWord(\''+w.w+'\')" onclick="speak(\''+w.w+'\')">🔊</button>'
    +'<button class="c-star '+st+'" onclick="toggleStar(\''+w.w+'\',this)">★</button>'
    +'</div>'
    +'<div class="c-ph">'+w.ph+'</div>'
    +'<div class="c-def">'+w.def+'</div>'
    +(w.ex?('<div class="c-ex"><span class="en">'+w.ex+'</span><span class="cn">'+(w.tr||'')+'</span></div>'):'')
    +'<button class="c-check" onclick="toggleMaster(\''+w.w+'\',this)">'+(store.mastered[w.w]?'✓ 已掌握':'标记掌握')+'</button>'
    +'</div>';
}
function toggleGroup(el){el.nextElementSibling.className=el.nextElementSibling.className.indexOf('collapsed')>-1?'g-body':'g-body collapsed';}
function toggleStar(w,btn){store.star[w]=!store.star[w];save();btn.className=store.star[w]?'c-star on':'c-star';updateStats();if(starOnly)renderBrowse();}
function toggleMaster(w,btn){
  store.mastered[w]=!store.mastered[w];save();updateStats();
  var card=btn.parentNode;while(card&&card.className.indexOf('card')<0){card=card.parentNode;}
  if(card){card.className=store.mastered[w]?'card mastered':'card';}
  btn.textContent=store.mastered[w]?'✓ 已掌握':'标记掌握';
}
window.toggleGroup=toggleGroup;window.toggleStar=toggleStar;window.toggleMaster=toggleMaster;

/* ============ 字母导航 ============ */
function buildLetterNav(){
  var seen={},letters=[],i;
  for(i=0;i<WORD_DATA.length;i++){var L=WORD_DATA[i].letter;if(!seen[L]){seen[L]=1;letters.push(L);}}
  var nav=document.getElementById('letterNav');
  var html='<button data-l="ALL" class="on" style="width:auto;padding:0 16px">全部</button>';
  for(i=0;i<letters.length;i++){html+='<button data-l="'+letters[i]+'">'+letters[i]+'</button>';}
  nav.innerHTML=html;
  var btns=nav.getElementsByTagName('button');
  for(i=0;i<btns.length;i++){
    btns[i].onclick=function(){
      curLetter=this.getAttribute('data-l');
      var bs=nav.getElementsByTagName('button');
      for(var k=0;k<bs.length;k++){bs[k].className=bs[k].className.replace(/\bon\b/,'').replace(/\s+$/,'');}
      this.className=(this.className+' on').replace(/\s+/g,' ');
      rerenderList();
    };
  }
}

/* ============ 模式切换 ============ */
(function(){
  var segBtns=document.querySelectorAll('#modeSeg button');
  for(var i=0;i<segBtns.length;i++){
    segBtns[i].onclick=function(){
      var all=document.querySelectorAll('#modeSeg button');
      for(var k=0;k<all.length;k++){all[k].className=all[k].className.replace(/\bon\b/,'').replace(/\s+$/,'');}
      this.className=(this.className+' on').replace(/\s+/g,' ');
      var m=this.getAttribute('data-mode');
      if(typeof spStop==='function')spStop();
      var fb=document.getElementById('filterBar');
      if(fb)fb.style.display=(m==='speed'||m==='browse')?'block':'none';
      setOn(document.getElementById('speedStage'),m==='speed','sp-stage');
      document.getElementById('browseStage').style.display=(m==='browse')?'block':'none';
      setOn(document.getElementById('flashStage'),m==='flash','fc-stage');
      setOn(document.getElementById('quizStage'),m==='quiz','quiz-stage');
      if(m==='speed')renderSpeed();
      if(m==='browse')renderBrowse();
      if(m==='flash')initFlash();
      if(m==='quiz')initQuiz();
    };
  }
})();
function setOn(el,on,base){el.className=on?(base+' on'):base;}
/* 按当前所处模式重绘列表（速览 / 浏览） */
function rerenderList(){
  var sp=document.getElementById('speedStage');
  if(sp&&sp.className.indexOf('on')>=0){renderSpeed();}
  else{renderBrowse();}
}

/* ============ 搜索 & 收藏筛选 ============ */
document.getElementById('searchInput').oninput=function(e){curSearch=(this.value||'').replace(/^\s+|\s+$/g,'');rerenderList();};
document.getElementById('filterStar').onclick=function(){starOnly=true;this.className='on';document.getElementById('filterAll').className='';rerenderList();};
document.getElementById('filterAll').onclick=function(){starOnly=false;this.className='on';document.getElementById('filterStar').className='';rerenderList();};

/* ============ 卡片模式 ============ */
var fcList=[],fcIdx=0;
function initFlash(){
  var sel=document.getElementById('fcScope');
  var html='<option value="ALL">全部单词 ('+allWords().length+')</option>'
    +'<option value="STAR">⭐ 我的收藏 ('+countStore(store.star)+')</option>';
  for(var i=0;i<WORD_DATA.length;i++){var g=WORD_DATA[i];html+='<option value="R:'+g.root+'">'+g.root+' · '+g.meaning+' ('+g.words.length+')</option>';}
  sel.innerHTML=html;
  sel.onchange=function(){buildFcList(sel.value);fcIdx=0;showFc();};
  buildFcList('ALL');fcIdx=0;showFc();
}
function buildFcList(scope){
  if(scope==='ALL'){fcList=allWords();}
  else if(scope==='STAR'){fcList=allWords().filter(function(w){return store.star[w.w];});}
  else{
    var r=scope.slice(2),g=null;
    for(var i=0;i<WORD_DATA.length;i++){if(WORD_DATA[i].root===r){g=WORD_DATA[i];break;}}
    fcList=[];
    if(g){for(var j=0;j<g.words.length;j++){fcList.push(copyWord(g.words[j],{root:g.root,mean:g.meaning}));}}
  }
}
function showFc(){
  var flip=document.getElementById('flip');flip.className='flip';
  if(fcList.length===0){document.getElementById('fcWord').textContent='暂无单词';document.getElementById('fcPh').textContent='';document.getElementById('fcProgress').textContent='0 / 0';return;}
  var w=fcList[fcIdx];
  document.getElementById('fcWord').textContent=w.w;
  document.getElementById('fcPh').textContent=w.ph;
  document.getElementById('fcDef').textContent=w.def;
  document.getElementById('fcExEn').textContent=w.ex||'';
  document.getElementById('fcExCn').textContent=w.tr||'';
  var isLG=w.root&&w.root.length===1&&/[A-Za-z]/.test(w.root);
  document.getElementById('fcRoot').textContent=isLG?('字母表 '+w.root):('词根 '+w.root+' · '+w.mean);
  document.getElementById('fcProgress').textContent=(fcIdx+1)+' / '+fcList.length;
  document.getElementById('fcMaster').textContent=store.mastered[w.w]?'✓ 已掌握':'✓ 标记掌握';
  preloadWord(w.w);                                        /* 当前词 */
  for(var pi=fcIdx+1;pi<=fcIdx+2&&pi<fcList.length;pi++){preloadWord(fcList[pi].w);}  /* 预热后两张 */
  if(fcIdx>0){preloadWord(fcList[fcIdx-1].w);}
}
document.getElementById('flip').onclick=function(){this.className=this.className.indexOf('flipped')>-1?'flip':'flip flipped';};
document.getElementById('fcPlay').onclick=function(e){if(e&&e.stopPropagation)e.stopPropagation();speak(fcList[fcIdx].w);};
document.getElementById('fcNext').onclick=function(){if(fcIdx<fcList.length-1){fcIdx++;showFc();}};
document.getElementById('fcPrev').onclick=function(){if(fcIdx>0){fcIdx--;showFc();}};
document.getElementById('fcMaster').onclick=function(){var w=fcList[fcIdx].w;store.mastered[w]=!store.mastered[w];save();updateStats();showFc();};

/* ============ 测验模式 ============ */
var quizList=[],qIdx=0,qScore=0;
function initQuiz(){quizList=shuffle(allWords()).slice(0,10);qIdx=0;qScore=0;renderQuiz();}
function renderQuiz(){
  var box=document.getElementById('quizBox');
  if(qIdx>=quizList.length){
    var face=qScore>=8?'🎉':(qScore>=6?'👍':'💪');
    var msg=qScore>=8?'太棒了，掌握得很牢固！':(qScore>=6?'不错，继续加油！':'再复习一下词根卡片吧～');
    box.innerHTML='<div class="quiz-result"><div style="font-size:40px">'+face+'</div>'
      +'<div class="big">'+qScore+' / '+quizList.length+'</div><p>'+msg+'</p>'
      +'<button class="fc-btn primary" onclick="initQuiz()">再来一组 →</button></div>';
    return;
  }
  var w=quizList[qIdx];
  var wrong=shuffle(allWords().filter(function(x){return x.w!==w.w;})).slice(0,3);
  var pool=[w.w];for(var i=0;i<wrong.length;i++){pool.push(wrong[i].w);}
  var opts=shuffle(pool);
  var optHtml='';
  for(i=0;i<opts.length;i++){optHtml+='<button class="q-opt" onclick="answerQuiz(this,\''+opts[i]+'\',\''+w.w+'\')">'+opts[i]+'</button>';}
  var isLG=w.root&&w.root.length===1&&/[A-Za-z]/.test(w.root);
  var tag=isLG?'':(' &nbsp;<b>[词根 '+w.root+'·'+w.mean+']</b>');
  box.innerHTML='<div class="q-num">第 '+(qIdx+1)+' / '+quizList.length+' 题 · 得分 '+qScore+'</div>'
    +'<div class="q-prompt">根据释义选出正确的单词'+tag+'</div>'
    +'<div class="q-def">'+w.def+'</div>'
    +'<div class="q-opts">'+optHtml+'</div>'
    +'<button class="q-next" id="qNext" onclick="qIdx_next()">下一题 →</button>';
  preloadWord(w.w);   /* 预热答案发音，答对即刻出声 */
}
function qIdx_next(){qIdx++;renderQuiz();}
function answerQuiz(btn,pick,ans){
  var opts=document.querySelectorAll('.q-opt');
  for(var i=0;i<opts.length;i++){opts[i].style.pointerEvents='none';}
  if(pick===ans){btn.className='q-opt correct';qScore++;speak(ans);}
  else{btn.className='q-opt wrong';for(i=0;i<opts.length;i++){if(opts[i].textContent===ans)opts[i].className='q-opt correct';}}
  var nx=document.getElementById('qNext');nx.className='q-next show';
}
function shuffle(a){a=toArr(a);for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
window.initQuiz=initQuiz;window.answerQuiz=answerQuiz;window.qIdx_next=qIdx_next;

/* ============ 键盘快捷键（卡片模式）============ */
document.addEventListener('keydown',function(e){
  if(document.getElementById('flashStage').className.indexOf('on')<0)return;
  if(e.key==='ArrowRight'||e.keyCode===39)document.getElementById('fcNext').click();
  if(e.key==='ArrowLeft'||e.keyCode===37)document.getElementById('fcPrev').click();
  if(e.key===' '||e.keyCode===32){e.preventDefault();document.getElementById('flip').click();}
});

/* ============ 周切换 ============ */
function buildWeekSelector(){
  var sel=document.getElementById('weekSel');
  if(!sel)return;
  var html='';
  for(var i=0;i<WEEKS.length;i++){
    var wc=0;for(var j=0;j<WEEKS[i].data.length;j++){wc+=WEEKS[i].data[j].words.length;}
    html+='<option value="'+i+'"'+(i===curWeek?' selected':'')+'>'+WEEKS[i].name+' ('+wc+'词)</option>';
  }
  sel.innerHTML=html;
  sel.onchange=function(){switchWeek(parseInt(this.value,10)||0);};
  applyWeekMeta();
}
function applyWeekMeta(){
  var wk=WEEKS[curWeek];
  var st=document.getElementById('subTitle');if(st)st.textContent=wk.sub;
  var lbl=document.getElementById('stRootsLabel');
  if(lbl){lbl.textContent=(wk.data.length&&isLetterGroup(wk.data[0]))?'字母组':'词根';}
  var hint=document.getElementById('weekHint');
  if(hint){var wc=0;for(var j=0;j<wk.data.length;j++){wc+=wk.data[j].words.length;}hint.textContent='本周 '+wc+' 词 · 共 '+WEEKS.length+' 周';}
}
function switchWeek(i){
  if(i<0||i>=WEEKS.length)return;
  curWeek=i;
  try{localStorage.setItem('wordmem_curweek',String(i));}catch(e){}
  WORD_DATA=WEEKS[curWeek].data;      /* 切换全局数据源 */
  curLetter='ALL';curSearch='';starOnly=false;
  var si=document.getElementById('searchInput');if(si)si.value='';
  var fa=document.getElementById('filterAll'),fs=document.getElementById('filterStar');
  if(fa)fa.className='on';if(fs)fs.className='';
  applyWeekMeta();
  buildLetterNav();
  updateStats();
  if(typeof spStop==='function')spStop();
  rerenderList();
  /* 若当前在卡片/测验模式，重置其内容 */
  if(document.getElementById('flashStage').className.indexOf('on')>=0)initFlash();
  if(document.getElementById('quizStage').className.indexOf('on')>=0)initQuiz();
}
window.switchWeek=switchWeek;

/* ============ 极速中文义速览 ============ */
/* 从冗长释义里抽取「核心中文义」：去括号注释 → 取首个词性段 → 取前1~2 个义项 */
function coreDef(def){
  var s=(''+(def||'')).replace(/（[^）]*）/g,'').replace(/\([^)]*\)/g,'').replace(/\s+/g,' ');
  var pos='',rest=s;
  var m=/^\s*((?:(?:n|vt|vi|v|adj|adv|ad|a|prep|conj|pron|num|int|aux|art)\.\s*\/?\s*)+)/.exec(s);
  if(m){pos=m[1].replace(/\s/g,'');rest=s.slice(m[0].length);}
  var m2=/[a-zA-Z]{1,4}\./.exec(rest);          /* 截断到下一个词性标记 */
  if(m2&&m2.index>0){rest=rest.slice(0,m2.index);}
  var parts=rest.split(/[；;，,、]/),out=[],i;
  for(i=0;i<parts.length&&out.length<2;i++){
    var p=parts[i].replace(/^\s+|\s+$/g,'');
    if(p){out.push(p);}
    if(out.join('，').length>=7){break;}
  }
  var cn=out.join('，');
  if(cn.length>14){cn=cn.slice(0,14)+'…';}
  if(!cn){cn=rest.replace(/^\s+|\s+$/g,'')||def;}
  pos=pos.split('/')[0].replace(/\.$/,'');
  return {pos:pos,cn:cn};
}
function posCls(p){
  if(!p){return '';}
  p=p.toLowerCase();
  if(p.charAt(0)==='n'){return 'p-n';}
  if(p.charAt(0)==='v'){return 'p-v';}
  if(p.indexOf('ad')===0){return 'p-d';}
  if(p.charAt(0)==='a'){return 'p-a';}
  return '';
}
var spView='both',spFull=false,spHideMastered=false;
function renderSpeed(){
  var box=document.getElementById('speedList');
  if(!box){return;}
  var groups=filteredGroups(),total=0,html='',i,j;
  for(i=0;i<groups.length;i++){
    var g=groups[i],ws=g.words;
    if(spHideMastered){ws=ws.filter(function(w){return !store.mastered[w.w];});}
    if(!ws.length){continue;}
    total+=ws.length;
    var isLG=isLetterGroup(g),items='';
    for(j=0;j<ws.length;j++){
      var w=ws[j],c=coreDef(w.def);
      var cn=spFull?w.def:c.cn;
      var cls='sp-item'+(store.mastered[w.w]?' mastered':'')
        +(spView==='hidecn'?' hcn':'')+(spView==='hideen'?' hen':'');
      items+='<div class="'+cls+'" data-w="'+w.w+'" title="'+w.ph+' '+w.def+'"'
        +' onmouseenter="preloadWord(\''+w.w+'\')" ontouchstart="preloadWord(\''+w.w+'\')"'
        +' onclick="spTap(this)" ondblclick="spMaster(this)">'
        +'<span class="sp-en">'+w.w+'</span>'
        +(c.pos?'<span class="sp-pos '+posCls(c.pos)+'">'+c.pos+'</span>':'')
        +'<span class="sp-cn">'+cn+'</span></div>';
    }
    html+='<div class="sp-gh"><span class="b">'+g.root+'</span>'
      +'<span class="m">'+(isLG?('字母 '+g.root):g.meaning)+'</span>'
      +'<span class="c">'+ws.length+' 词</span></div>'
      +'<div class="sp-grid">'+items+'</div>';
  }
  box.innerHTML=html||'<div class="empty"><div class="ico">🔍</div>没有匹配的单词</div>';
  var info=document.getElementById('spInfo');
  if(info){info.textContent=total+' 词 · 已掌握 '+countStore(store.mastered);}
  if(typeof warmVisible==='function'){setTimeout(warmVisible,120);}   /* 渲染后预热首屏发音 */
}
function spTap(el){
  if(el.className.indexOf('reveal')<0){el.className=el.className+' reveal';}
  speak(el.getAttribute('data-w'));
}
function spMaster(el){
  var w=el.getAttribute('data-w');
  store.mastered[w]=!store.mastered[w];save();updateStats();
  el.className=store.mastered[w]?(el.className+' mastered'):el.className.replace(/\s*mastered/,'');
  var info=document.getElementById('spInfo');
  if(info&&spHideMastered){renderSpeed();}
  else if(info){info.textContent=info.textContent.replace(/已掌握 \d+/,'已掌握 '+countStore(store.mastered));}
}
/* ---- 连续播放：读完即下一个（不用固定定时器），并提前预热后 3 个词 ---- */
var spPlaying=false,spQueue=[],spQi=0,spGapT=null;
function spStop(){
  spPlaying=false;
  if(spGapT){clearTimeout(spGapT);spGapT=null;}
  if(_cur){try{_cur.pause();}catch(e){}}
  for(var i=0;i<spQueue.length;i++){spQueue[i].className=spQueue[i].className.replace(/\s*speaking/,'');}
  var b=document.getElementById('spAutoPlay');
  if(b){b.className='sp-btn';b.textContent='▶ 连续播放';}
}
function spStep(){
  if(!spPlaying){return;}
  if(spQi>=spQueue.length){spStop();return;}
  var i,el=spQueue[spQi];
  for(i=0;i<spQueue.length;i++){spQueue[i].className=spQueue[i].className.replace(/\s*speaking/,'');}
  el.className=el.className+' speaking';
  if(el.className.indexOf('reveal')<0){el.className=el.className+' reveal';}
  try{el.scrollIntoView({block:'center'});}catch(e){try{el.scrollIntoView();}catch(e2){}}
  /* 提前预热后面 3 个，轮到它们时已在缓存里 */
  for(i=spQi+1;i<=spQi+3&&i<spQueue.length;i++){preloadWord(spQueue[i].getAttribute('data-w'));}
  spQi++;
  speak(el.getAttribute('data-w'),function(){
    if(!spPlaying){return;}
    spGapT=setTimeout(spStep,700);   /* 词间留0.7s 停顿 */
  });
}
function spAutoToggle(){
  if(spPlaying){spStop();return;}
  spQueue=toArr(document.querySelectorAll('#speedList .sp-item'));
  if(!spQueue.length){return;}
  spQi=0;spPlaying=true;
  var b=document.getElementById('spAutoPlay');
  if(b){b.className='sp-btn playing';b.textContent='■ 停止';}
  spStep();
}
/* 预热当前视口内的词条（滚动停下后批量加载，点哪个都是秒响） */
var warmT=null;
function warmVisible(){
  var items=document.querySelectorAll('#speedList .sp-item');
  var n=0,h=window.innerHeight||600;
  for(var i=0;i<items.length&&n<40;i++){
    var r=items[i].getBoundingClientRect();
    if(r.bottom>-200&&r.top<h+400){preloadWord(items[i].getAttribute('data-w'));n++;}
  }
}
window.warmVisible=warmVisible;
function scheduleWarm(){if(warmT){clearTimeout(warmT);}warmT=setTimeout(warmVisible,420);}
if(window.addEventListener){window.addEventListener('scroll',scheduleWarm,false);}
else if(window.attachEvent){window.attachEvent('onscroll',scheduleWarm);}

window.spTap=spTap;window.spMaster=spMaster;
(function(){
  var vb=document.querySelectorAll('#spViewSeg button'),i;
  for(i=0;i<vb.length;i++){
    vb[i].onclick=function(){
      var all=document.querySelectorAll('#spViewSeg button');
      for(var k=0;k<all.length;k++){all[k].className=all[k].className.replace(/\bon\b/,'').replace(/\s+$/,'');}
      this.className=(this.className+' on').replace(/\s+/g,' ');
      spView=this.getAttribute('data-v');renderSpeed();
    };
  }
  document.getElementById('spFull').onclick=function(){spFull=!!this.checked;renderSpeed();};
  document.getElementById('spHideMastered').onclick=function(){spHideMastered=!!this.checked;renderSpeed();};
  document.getElementById('spAutoPlay').onclick=spAutoToggle;
})();

/* ============ 初始化 ============ */
buildWeekSelector();
buildLetterNav();
updateStats();
renderSpeed();
})();
</script>
