<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词根记忆卡 · 高频词汇 T-V</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1f2937; --sub:#6b7280;
  --line:#e5e7eb; --brand:#4f46e5; --brand2:#7c3aed; --brand-soft:#eef2ff;
  --ok:#059669; --ok-soft:#ecfdf5; --warn:#d97706; --star:#f59e0b;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(31,41,55,.06);
  --shadow-lg:0 12px 40px rgba(79,70,229,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- Header ---------- */
header{background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#9333ea);color:#fff;
  padding:30px 0 26px;box-shadow:0 6px 24px rgba(79,70,229,.25)}
.hd-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.16);
  display:grid;place-items:center;font-size:24px;backdrop-filter:blur(6px)}
.brand h1{font-size:21px;font-weight:800;letter-spacing:.5px}
.brand p{font-size:12.5px;opacity:.85;font-weight:500}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);
  border-radius:12px;padding:8px 14px;text-align:center;min-width:74px;backdrop-filter:blur(6px)}
.stat b{display:block;font-size:19px;font-weight:800}
.stat span{font-size:11px;opacity:.85}

/* ---------- Toolbar ---------- */
.toolbar{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  margin:-18px auto 22px;padding:14px 16px;display:flex;gap:12px;align-items:center;
  flex-wrap:wrap;position:relative;z-index:5}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;border:1.5px solid var(--line);border-radius:11px;
  padding:11px 14px 11px 38px;font-size:14.5px;outline:none;transition:.2s;background:#fbfbfd}
.search input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.search::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
.seg{display:flex;background:#f1f2f7;border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 15px;border-radius:9px;
  font-size:13.5px;font-weight:600;color:var(--sub);cursor:pointer;transition:.18s;white-space:nowrap}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.accent-sel{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--sub)}
.accent-sel select{border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;
  font-size:13.5px;background:#fbfbfd;cursor:pointer;color:var(--ink);outline:none}

/* ---------- Letter nav ---------- */
.letters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.letters button{border:1.5px solid var(--line);background:#fff;border-radius:10px;
  width:40px;height:40px;font-weight:800;font-size:15px;color:var(--sub);cursor:pointer;transition:.18s}
.letters button:hover{border-color:var(--brand);color:var(--brand)}
.letters button.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ---------- Root group ---------- */
.group{background:var(--card);border-radius:18px;box-shadow:var(--shadow);
  margin-bottom:18px;overflow:hidden}
.g-head{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;
  background:linear-gradient(90deg,var(--brand-soft),#fff);border-bottom:1px solid var(--line)}
.g-badge{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:800;
  padding:7px 15px;border-radius:11px;font-size:15px;letter-spacing:.5px;box-shadow:0 3px 10px rgba(79,70,229,.3)}
.g-mean{font-size:16px;font-weight:700;color:var(--ink)}
.g-mean small{color:var(--sub);font-weight:500;font-size:13px;margin-left:6px}
.g-count{margin-left:auto;font-size:12.5px;color:var(--sub);background:#f1f2f7;
  padding:4px 11px;border-radius:20px;font-weight:600}
.g-play{border:0;background:var(--brand-soft);color:var(--brand);width:36px;height:36px;
  border-radius:10px;cursor:pointer;font-size:15px;transition:.18s;flex-shrink:0}
.g-play:hover{background:var(--brand);color:#fff}

.g-body{padding:16px 20px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.g-body.collapsed{display:none}

/* ---------- Word card ---------- */
.card{border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;
  background:#fff;transition:.2s;position:relative}
.card:hover{border-color:#c7cbf5;box-shadow:var(--shadow);transform:translateY(-2px)}
.card.mastered{background:var(--ok-soft);border-color:#a7f3d0}
.c-top{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.c-word{font-size:19px;font-weight:800;color:var(--brand);letter-spacing:.3px}
.card.mastered .c-word{color:var(--ok)}
.c-play{border:0;background:var(--brand-soft);color:var(--brand);width:30px;height:30px;
  border-radius:8px;cursor:pointer;font-size:13px;transition:.18s;flex-shrink:0}
.c-play:hover{background:var(--brand);color:#fff;transform:scale(1.08)}
.c-star{margin-left:auto;border:0;background:transparent;font-size:19px;cursor:pointer;
  opacity:.3;transition:.18s;line-height:1}
.c-star:hover{opacity:.7;transform:scale(1.15)}
.c-star.on{opacity:1;filter:drop-shadow(0 1px 3px rgba(245,158,11,.4))}
.c-ph{font-size:13px;color:var(--sub);font-family:"Times New Roman",Georgia,serif;margin-bottom:7px}
.c-def{font-size:13.5px;color:#374151;margin-bottom:8px;line-height:1.55}
.c-ex{font-size:12.5px;color:var(--sub);border-left:3px solid var(--brand-soft);
  padding:2px 0 2px 10px;font-style:italic}
.c-ex .en{color:#4b5563;display:block}
.c-ex .cn{color:#9ca3af;font-style:normal;display:block;margin-top:1px}
.c-check{position:absolute;bottom:12px;right:13px;border:0;background:#f1f2f7;color:var(--sub);
  font-size:11px;padding:4px 10px;border-radius:20px;cursor:pointer;font-weight:600;transition:.18s;display:none}
.card:hover .c-check{display:block}
.card.mastered .c-check{display:block;background:var(--ok);color:#fff}

/* ---------- Flashcard mode ---------- */
.fc-stage{display:none;padding:24px 0 40px}
.fc-stage.on{display:block}
.fc-bar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;justify-content:center}
.fc-progress{font-size:13.5px;color:var(--sub);font-weight:600}
.fc-scope{border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13.5px;background:#fff;cursor:pointer;outline:none}
.flip{max-width:520px;margin:0 auto;perspective:1600px}
.flip-inner{position:relative;width:100%;min-height:290px;transition:transform .6s;
  transform-style:preserve-3d;cursor:pointer}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;
  background:var(--card);box-shadow:var(--shadow-lg);padding:34px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;text-align:center}
.face.back{transform:rotateY(180deg);background:linear-gradient(135deg,#faf7ff,#fff)}
.fc-word{font-size:40px;font-weight:800;color:var(--brand);letter-spacing:1px;margin-bottom:10px}
.fc-ph{font-size:17px;color:var(--sub);font-family:Georgia,serif;margin-bottom:22px}
.fc-play-big{border:0;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;
  width:58px;height:58px;border-radius:50%;font-size:24px;cursor:pointer;box-shadow:0 6px 18px rgba(79,70,229,.35);transition:.2s}
.fc-play-big:hover{transform:scale(1.1)}
.fc-hint{font-size:12.5px;color:#c0c4cc;margin-top:20px}
.fc-def{font-size:17px;color:var(--ink);font-weight:600;margin-bottom:16px;line-height:1.7}
.fc-ex-en{font-size:14px;color:#4b5563;font-style:italic;margin-bottom:4px}
.fc-ex-cn{font-size:13px;color:var(--sub)}
.fc-root{margin-top:18px;font-size:12px;color:var(--brand);background:var(--brand-soft);padding:4px 12px;border-radius:20px}
.fc-ctrl{display:flex;gap:12px;justify-content:center;margin-top:24px}
.fc-btn{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 26px;
  font-size:15px;font-weight:700;cursor:pointer;transition:.18s;color:var(--ink)}
.fc-btn:hover{border-color:var(--brand);color:var(--brand)}
.fc-btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.fc-btn.primary:hover{background:#4338ca;color:#fff}
.fc-btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}

/* ---------- Quiz mode ---------- */
.quiz-stage{display:none;padding:24px 0 40px}
.quiz-stage.on{display:block}
.quiz-box{max-width:560px;margin:0 auto;background:var(--card);border-radius:22px;
  box-shadow:var(--shadow-lg);padding:32px 30px}
.q-num{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:6px}
.q-prompt{font-size:15px;color:var(--ink);margin-bottom:18px}
.q-prompt b{color:var(--brand);font-size:17px}
.q-def{font-size:20px;font-weight:700;text-align:center;padding:20px;background:var(--brand-soft);
  border-radius:14px;margin-bottom:20px;color:#4338ca}
.q-opts{display:grid;gap:10px}
.q-opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px 18px;
  font-size:16px;font-weight:600;cursor:pointer;text-align:left;transition:.15s;color:var(--ink);font-family:Georgia,serif}
.q-opt:hover{border-color:var(--brand);background:var(--brand-soft)}
.q-opt.correct{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.q-opt.wrong{background:#fef2f2;border-color:#f87171;color:#dc2626}
.q-next{margin-top:20px;width:100%;border:0;background:var(--brand);color:#fff;
  border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;transition:.18s;display:none}
.q-next.show{display:block}
.q-next:hover{background:#4338ca}
.quiz-result{text-align:center;padding:20px 0}
.quiz-result .big{font-size:52px;font-weight:800;color:var(--brand);margin:8px 0}
.quiz-result p{color:var(--sub);margin-bottom:20px}

.empty{text-align:center;padding:50px 20px;color:var(--sub)}
.empty .ico{font-size:44px;margin-bottom:12px}
footer{text-align:center;padding:28px 20px;color:#9ca3af;font-size:12.5px}
@media(max-width:560px){
  .g-body{grid-template-columns:1fr}
  .stats{width:100%;justify-content:flex-start}
  .fc-word{font-size:32px}
}
</style>
</head>
<body>
<header>
  <div class="wrap hd-top">
    <div class="brand">
      <div class="logo">📖</div>
      <div>
        <h1>词根记忆卡</h1>
        <p>高频词汇 T–V · 词根词缀分组速记</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="stWords">0</b><span>单词</span></div>
      <div class="stat"><b id="stRoots">0</b><span>词根</span></div>
      <div class="stat"><b id="stMastered">0</b><span>已掌握</span></div>
      <div class="stat"><b id="stStar">0</b><span>收藏</span></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="search"><input id="searchInput" placeholder="搜索单词 / 词根 / 释义…"></div>
    <div class="seg" id="modeSeg">
      <button data-mode="browse" class="on">📚 浏览</button>
      <button data-mode="flash">🎴 卡片</button>
      <button data-mode="quiz">✏️ 测验</button>
    </div>
    <div class="accent-sel">
      🔊<select id="accentSel">
        <option value="en-GB">英式发音</option>
        <option value="en-US">美式发音</option>
      </select>
    </div>
  </div>

  <!-- BROWSE -->
  <div id="browseStage">
    <div class="letters" id="letterNav"></div>
    <div class="letters" style="margin-top:-8px">
      <button id="filterStar" style="width:auto;padding:0 14px">⭐ 只看收藏</button>
      <button id="filterAll" class="on" style="width:auto;padding:0 14px">全部单词</button>
    </div>
    <div id="groupList"></div>
  </div>

  <!-- FLASHCARD -->
  <div id="flashStage" class="fc-stage">
    <div class="fc-bar">
      <select class="fc-scope" id="fcScope"></select>
      <span class="fc-progress" id="fcProgress">0 / 0</span>
    </div>
    <div class="flip" id="flip">
      <div class="flip-inner">
        <div class="face front">
          <div class="fc-word" id="fcWord">—</div>
          <div class="fc-ph" id="fcPh"></div>
          <button class="fc-play-big" id="fcPlay">🔊</button>
          <div class="fc-hint">点击卡片查看释义 · 点喇叭听发音</div>
        </div>
        <div class="face back">
          <div class="fc-def" id="fcDef"></div>
          <div class="fc-ex-en" id="fcExEn"></div>
          <div class="fc-ex-cn" id="fcExCn"></div>
          <div class="fc-root" id="fcRoot"></div>
        </div>
      </div>
    </div>
    <div class="fc-ctrl">
      <button class="fc-btn" id="fcPrev">← 上一个</button>
      <button class="fc-btn ok" id="fcMaster">✓ 已掌握</button>
      <button class="fc-btn primary" id="fcNext">下一个 →</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quizStage" class="quiz-stage">
    <div class="quiz-box" id="quizBox"></div>
  </div>
</div>

<footer>词根记忆卡 · 数据来自「品睿教育」高频词汇表 · 发音由浏览器语音合成（Web Speech API）提供</footer>

<script>

      { w: "update", ph: "[ˌʌpˈdeɪt]", def: "v.更新,使现代化", ex: "We'll update you on the day's top news stories.", tr: "我们将向你提供当天的头条新闻。" },
      { w: "up-to-date", ph: "[ˌʌptəˈdeɪt]", def: "a.现代化的，最新的；跟上时代的", ex: "You need an up-to-date Web browser.", tr: "你需要一个最新的网络浏览器。" }
    ]
  },
  {
    root: "urg", meaning: "催促", letter: "U",
    words: [
      { w: "urge", ph: "[ɜːdʒ]", def: "vt.催促;怂恿;强调 n.强烈欲望,迫切要求", ex: "We urge Congress to increase farmland conservation.", tr: "我们敦促国会加强耕地保护。" },
      { w: "urgent", ph: "[ˈɜːdʒənt]", def: "a.急迫的，紧要的，紧急的", ex: "This condition requires urgent treatment.", tr: "这种情况得紧急处理。" }
    ]
  },
  {
    root: "use", meaning: "用", letter: "U",
    words: [
      { w: "use", ph: "[juːz]", def: "n.使/应用；用法/途；益/用处 vt.用；消耗", ex: "Can I use your phone, please?", tr: "我可以用一下你的电话吗？" },
      { w: "used", ph: "[juːst]", def: "a.用旧了的，旧的；习惯于...；过去惯/经常", ex: "I'm not used to eating so much at lunchtime.", tr: "我不习惯午饭吃那么多。" },
      { w: "useful", ph: "[ˈjuːsfl]", def: "a.有用的，实用的；有益的，有帮助的", ex: "Photos make useful teaching aids.", tr: "照片可以成为有用的教具。" },
      { w: "usage", ph: "[ˈjuːsɪdʒ; ˈjuːzɪdʒ]", def: "n.使用，用法；利用，利用率", ex: "Car usage is predicted to increase.", tr: "汽车的使用率预计会增长。" },
      { w: "abuse", ph: "[əˈbjuːs]", def: "vt.滥用；辱骂，诋毁 n.滥用；恶习；弊端", ex: "He was arrested on charges of corruption and abuse of power.", tr: "他因被控贪污腐化和滥用职权而遭逮捕。" },
      { w: "utilize", ph: "[ˈjuːtəlaɪz]", def: "vt.利用", ex: "Sound engineers utilize a range of techniques to enhance the quality of the recordings.", tr: "音响工程师利用一系列的技术来提高录音质量。" }
    ]
  },
  {
    root: "vac", meaning: "空", letter: "V",
    words: [
      { w: "vacant", ph: "[ˈveɪkənt]", def: "a.空的,未占用的;空缺的;神情茫然的", ex: "The seat next to him was vacant.", tr: "他旁边的座位空着。" },
      { w: "vacation", ph: "[veɪˈkeɪʃn; vəˈkeɪʃn]", def: "n.休假,假期", ex: "They're on vacation in Hawaii right now.", tr: "他们此时正在夏威夷度假。" },
      { w: "vacuum", ph: "[ˈvækjuːm]", def: "n.真空,真空吸尘器", ex: "Vacuum cleaners work by suction.", tr: "真空吸尘器靠抽吸除尘。" },
      { w: "evacuate", ph: "[ɪˈvækjueɪt]", def: "vt.撤离,疏散,排泄,剥夺", ex: "It has forced politicians to think again about the wisdom of trying to evacuate refugees.", tr: "这已迫使政客们重新考虑试图疏散难民是否明智。" },
      { w: "vain", ph: "[veɪn]", def: "a.徒劳的,徒然的;自负的,爱虚荣的", ex: "All our efforts were in vain.", tr: "我们的所有努力都付诸东流了。" },
      { w: "vanity", ph: "[ˈvænəti]", def: "n.虚荣心,浮华", ex: "She had no personal vanity about her appearance.", tr: "她对自己的相貌毫不自负。" },
      { w: "avoid", ph: "[əˈvɔɪd]", def: "vt.防止，避免；逃避，避开", ex: "A person's health improves with the avoidance of stress.", tr: "一个人只要避免紧张，健康状况就会改善。" },
      { w: "void", ph: "[vɔɪd]", def: "a.空虚的;没有的;无效的", ex: "The contract was declared void.", tr: "这份合同被宣布无效。" },
      { w: "vanish", ph: "[ˈvænɪʃ]", def: "vi.突然不见;消失", ex: "The magician made a coin vanish.", tr: "魔术师让一枚硬币消失了。" }
    ]
  }
];

</script>
<script>
/* ============ 状态 ============ */
const LS='wordmem_tv_v1';
let store=JSON.parse(localStorage.getItem(LS)||'{}');
store.mastered=store.mastered||{};
store.star=store.star||{};
function save(){localStorage.setItem(LS,JSON.stringify(store))}

let curLetter='ALL', curSearch='', starOnly=false;

/* ============ 发音 ============ */
let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices()}
loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;
function speak(text){
  if(!('speechSynthesis' in window)){alert('当前浏览器不支持语音朗读');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const lang=document.getElementById('accentSel').value;
  u.lang=lang; u.rate=.9; u.pitch=1;
  const v=voices.find(x=>x.lang===lang)||voices.find(x=>x.lang.startsWith('en'));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

/* ============ 工具 ============ */
function allWords(){
  const arr=[];
  WORD_DATA.forEach(g=>g.words.forEach(w=>arr.push({...w,root:g.root,mean:g.meaning,letter:g.letter})));
  return arr;
}
function filteredGroups(){
  return WORD_DATA.filter(g=>curLetter==='ALL'||g.letter===curLetter)
    .map(g=>{
      let ws=g.words;
      if(starOnly)ws=ws.filter(w=>store.star[w.w]);
      if(curSearch){
        const q=curSearch.toLowerCase();
        ws=ws.filter(w=>w.w.toLowerCase().includes(q)||w.def.includes(curSearch)||g.root.includes(q)||g.meaning.includes(curSearch));
      }
      return {...g,words:ws};
    }).filter(g=>g.words.length>0);
}

/* ============ 统计 ============ */
function updateStats(){
  const aw=allWords();
  document.getElementById('stWords').textContent=aw.length;
  document.getElementById('stRoots').textContent=WORD_DATA.length;
  document.getElementById('stMastered').textContent=Object.values(store.mastered).filter(Boolean).length;
  document.getElementById('stStar').textContent=Object.values(store.star).filter(Boolean).length;
}

/* ============ 浏览渲染 ============ */
function renderBrowse(){
  const box=document.getElementById('groupList');
  const groups=filteredGroups();
  if(groups.length===0){
    box.innerHTML='<div class="empty"><div class="ico">🔍</div>没有匹配的单词</div>';return;
  }
  box.innerHTML=groups.map(g=>`
    <div class="group">
      <div class="g-head" onclick="toggleGroup(this)">
        <span class="g-badge">${g.root}</span>
        <span class="g-mean">${g.meaning}<small>词根 · ${g.letter}</small></span>
        <button class="g-play" onclick="event.stopPropagation();speak('${g.root}')">🔊</button>
        <span class="g-count">${g.words.length} 词</span>
      </div>
      <div class="g-body">
        ${g.words.map(w=>cardHTML(w,g)).join('')}
      </div>
    </div>`).join('');
}
function cardHTML(w,g){
  const m=store.mastered[w.w]?'mastered':'';
  const st=store.star[w.w]?'on':'';
  return `<div class="card ${m}" data-w="${w.w}">
    <div class="c-top">
      <span class="c-word">${w.w}</span>
      <button class="c-play" onclick="speak('${w.w}')">🔊</button>
      <button class="c-star ${st}" onclick="toggleStar('${w.w}',this)">★</button>
    </div>
    <div class="c-ph">${w.ph}</div>
    <div class="c-def">${w.def}</div>
    <div class="c-ex">
      <span class="en">${w.ex}</span>
      <span class="cn">${w.tr}</span>
    </div>
    <button class="c-check" onclick="toggleMaster('${w.w}',this)">${store.mastered[w.w]?'✓ 已掌握':'标记掌握'}</button>
  </div>`;
}
function toggleGroup(el){el.nextElementSibling.classList.toggle('collapsed')}
function toggleStar(w,btn){store.star[w]=!store.star[w];save();btn.classList.toggle('on');updateStats();if(starOnly)renderBrowse()}
function toggleMaster(w,btn){
  store.mastered[w]=!store.mastered[w];save();updateStats();
  const card=btn.closest('.card');
  card.classList.toggle('mastered');
  btn.textContent=store.mastered[w]?'✓ 已掌握':'标记掌握';
}

/* ============ 字母导航 ============ */
function buildLetterNav(){
  const letters=[...new Set(WORD_DATA.map(g=>g.letter))];
  const nav=document.getElementById('letterNav');
  nav.innerHTML=`<button data-l="ALL" class="on" style="width:auto;padding:0 16px">全部</button>`+
    letters.map(l=>`<button data-l="${l}">${l}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    curLetter=b.dataset.l;
    nav.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');renderBrowse();
  });
}

/* ============ 模式切换 ============ */
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const m=b.dataset.mode;
  document.getElementById('browseStage').style.display=m==='browse'?'block':'none';
  document.getElementById('flashStage').classList.toggle('on',m==='flash');
  document.getElementById('quizStage').classList.toggle('on',m==='quiz');
  if(m==='flash')initFlash();
  if(m==='quiz')initQuiz();
});

/* ============ 搜索 & 收藏筛选 ============ */
document.getElementById('searchInput').oninput=e=>{curSearch=e.target.value.trim();renderBrowse()};
document.getElementById('filterStar').onclick=function(){starOnly=true;this.classList.add('on');document.getElementById('filterAll').classList.remove('on');renderBrowse()};
document.getElementById('filterAll').onclick=function(){starOnly=false;this.classList.add('on');document.getElementById('filterStar').classList.remove('on');renderBrowse()};

/* ============ 卡片模式 ============ */
let fcList=[],fcIdx=0;
function initFlash(){
  const sel=document.getElementById('fcScope');
  sel.innerHTML=`<option value="ALL">全部单词 (${allWords().length})</option>`+
    `<option value="STAR">⭐ 我的收藏 (${Object.values(store.star).filter(Boolean).length})</option>`+
    WORD_DATA.map(g=>`<option value="R:${g.root}">${g.root} · ${g.meaning} (${g.words.length})</option>`).join('');
  sel.onchange=()=>{buildFcList(sel.value);fcIdx=0;showFc()};
  buildFcList('ALL');fcIdx=0;showFc();
}
function buildFcList(scope){
  if(scope==='ALL')fcList=allWords();
  else if(scope==='STAR')fcList=allWords().filter(w=>store.star[w.w]);
  else{const r=scope.slice(2);const g=WORD_DATA.find(x=>x.root===r);fcList=g.words.map(w=>({...w,root:g.root,mean:g.meaning}))}
}
function showFc(){
  document.getElementById('flip').classList.remove('flipped');
  if(fcList.length===0){document.getElementById('fcWord').textContent='暂无单词';document.getElementById('fcPh').textContent='';document.getElementById('fcProgress').textContent='0 / 0';return}
  const w=fcList[fcIdx];
  document.getElementById('fcWord').textContent=w.w;
  document.getElementById('fcPh').textContent=w.ph;
  document.getElementById('fcDef').textContent=w.def;
  document.getElementById('fcExEn').textContent=w.ex;
  document.getElementById('fcExCn').textContent=w.tr;
  document.getElementById('fcRoot').textContent='词根 '+w.root+' · '+w.mean;
  document.getElementById('fcProgress').textContent=`${fcIdx+1} / ${fcList.length}`;
  const mb=document.getElementById('fcMaster');
  mb.textContent=store.mastered[w.w]?'✓ 已掌握':'✓ 标记掌握';
}
document.getElementById('flip').onclick=function(){this.classList.toggle('flipped')};
document.getElementById('fcPlay').onclick=e=>{e.stopPropagation();speak(fcList[fcIdx].w)};
document.getElementById('fcNext').onclick=()=>{if(fcIdx<fcList.length-1){fcIdx++;showFc()}};
document.getElementById('fcPrev').onclick=()=>{if(fcIdx>0){fcIdx--;showFc()}};
document.getElementById('fcMaster').onclick=()=>{const w=fcList[fcIdx].w;store.mastered[w]=!store.mastered[w];save();updateStats();showFc()};

/* ============ 测验模式 ============ */
let quizList=[],qIdx=0,qScore=0;
function initQuiz(){
  quizList=shuffle(allWords()).slice(0,10);
  qIdx=0;qScore=0;renderQuiz();
}
function renderQuiz(){
  const box=document.getElementById('quizBox');
  if(qIdx>=quizList.length){
    box.innerHTML=`<div class="quiz-result">
      <div style="font-size:40px">${qScore>=8?'🎉':qScore>=6?'👍':'💪'}</div>
      <div class="big">${qScore} / ${quizList.length}</div>
      <p>${qScore>=8?'太棒了，掌握得很牢固！':qScore>=6?'不错，继续加油！':'再复习一下词根卡片吧～'}</p>
      <button class="fc-btn primary" onclick="initQuiz()">再来一组 →</button>
    </div>`;return;
  }
  const w=quizList[qIdx];
  const opts=shuffle([w.w,...shuffle(allWords().filter(x=>x.w!==w.w)).slice(0,3).map(x=>x.w)]);
  box.innerHTML=`
    <div class="q-num">第 ${qIdx+1} / ${quizList.length} 题 · 得分 ${qScore}</div>
    <div class="q-prompt">根据释义选出正确的单词 &nbsp;<b>[词根 ${w.root}·${w.mean}]</b></div>
    <div class="q-def">${w.def}</div>
    <div class="q-opts">${opts.map(o=>`<button class="q-opt" onclick="answerQuiz(this,'${o}','${w.w}')">${o}</button>`).join('')}</div>
    <button class="q-next" id="qNext" onclick="qIdx++;renderQuiz()">下一题 →</button>`;
}
function answerQuiz(btn,pick,ans){
  const opts=document.querySelectorAll('.q-opt');
  opts.forEach(o=>o.style.pointerEvents='none');
  if(pick===ans){btn.classList.add('correct');qScore++;speak(ans)}
  else{btn.classList.add('wrong');opts.forEach(o=>{if(o.textContent===ans)o.classList.add('correct')})}
  document.getElementById('qNext').classList.add('show');
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ============ 键盘快捷键（卡片模式）============ */
document.addEventListener('keydown',e=>{
  if(!document.getElementById('flashStage').classList.contains('on'))return;
  if(e.key==='ArrowRight')document.getElementById('fcNext').click();
  if(e.key==='ArrowLeft')document.getElementById('fcPrev').click();
  if(e.key===' '){e.preventDefault();document.getElementById('flip').click()}
});

/* ============ 初始化 ============ */
buildLetterNav();
updateStats();
renderBrowse();
</script>
</body>
</html>
